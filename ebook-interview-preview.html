<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>대입 면접이 쉬워지는 스피치 공식 — 미리보기 10페이지 | LAEL LAB</title>
  <meta name="description" content="대입 면접이 쉬워지는 스피치 공식 전자책 무료 미리보기 10페이지. 구매 후 전체 열람 가능.">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' stop-color='%234c37ce'/%3E%3Cstop offset='100%25' stop-color='%23ff6748'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='32' height='32' rx='8' fill='url(%23g)'/%3E%3Ctext x='16' y='22' font-family='sans-serif' font-size='18' font-weight='900' fill='white' text-anchor='middle'%3EL%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Noto Sans KR',sans-serif;background:#525659;color:#111}

    /* 헤더 */
    .reader-header{
      height:52px;background:#fff;border-bottom:1px solid #ececec;
      display:flex;align-items:center;justify-content:space-between;
      padding:0 20px;position:sticky;top:0;z-index:100;
      box-shadow:0 1px 6px rgba(0,0,0,.08);
    }
    .header-left{display:flex;align-items:center;gap:10px}
    .back-btn{display:flex;align-items:center;gap:4px;font-size:13px;font-weight:700;color:#555;text-decoration:none}
    .back-btn:hover{color:#4c37ce}
    .divider{color:#ddd}
    .dot{width:8px;height:8px;border-radius:50%;background:#4c37ce;flex-shrink:0}
    .book-title{font-size:13px;font-weight:700;color:#111;max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .preview-badge{font-size:11px;background:#fff0f0;color:#e53e3e;padding:3px 8px;border-radius:20px;font-weight:700}
    .header-right{display:flex;align-items:center;gap:8px}
    .btn-buy-sm{
      display:flex;align-items:center;gap:4px;
      background:#4c37ce;color:#fff;border:none;border-radius:8px;
      padding:7px 14px;font-size:12px;font-weight:700;cursor:pointer;text-decoration:none;
      transition:.2s;
    }
    .btn-buy-sm:hover{background:#3d2bb0}

    /* PDF 렌더 영역 */
    .pdf-wrapper{
      display:flex;flex-direction:column;align-items:center;
      gap:12px;padding:24px 16px 0;
    }
    .page-canvas{
      display:block;
      box-shadow:0 4px 20px rgba(0,0,0,.35);
      border-radius:2px;
      max-width:100%;
    }
    .page-label{
      color:rgba(255,255,255,.45);font-size:11px;text-align:center;margin-top:-4px;
    }

    /* 로딩 */
    .loader{
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      min-height:60vh;gap:16px;
    }
    .spinner{
      width:44px;height:44px;border:4px solid rgba(255,255,255,.2);
      border-top-color:#fff;border-radius:50%;
      animation:spin .8s linear infinite;
    }
    @keyframes spin{to{transform:rotate(360deg)}}
    .loader p{color:rgba(255,255,255,.6);font-size:13px}

    /* 미리보기 종료 CTA */
    .preview-end{
      margin:32px 16px 60px;
      background:linear-gradient(135deg,#4c37ce,#3d2bb0);
      border-radius:20px;overflow:hidden;
      box-shadow:0 20px 60px rgba(76,55,206,.4);
      max-width:600px;
      width:100%;
    }
    .pe-fade{
      height:120px;
      background:linear-gradient(to bottom,transparent,rgba(76,55,206,.6));
      margin-top:-60px;
    }
    .pe-body{
      padding:32px 28px 36px;
      text-align:center;
    }
    .pe-icon{font-size:40px;margin-bottom:12px}
    .pe-title{font-size:22px;font-weight:900;color:#fff;margin-bottom:8px;line-height:1.3}
    .pe-sub{font-size:14px;color:rgba(255,255,255,.75);margin-bottom:24px;line-height:1.6}
    .pe-price{font-size:28px;font-weight:900;color:#ffd700;margin-bottom:20px}
    .pe-btn-buy{
      display:flex;align-items:center;justify-content:center;gap:8px;
      background:#fff;color:#4c37ce;
      padding:15px 32px;border-radius:50px;
      font-size:15px;font-weight:900;text-decoration:none;
      margin-bottom:12px;transition:.2s;width:100%;
    }
    .pe-btn-buy:hover{background:#f0eeff;transform:translateY(-1px)}
    .pe-btn-home{
      display:block;color:rgba(255,255,255,.6);
      font-size:13px;text-decoration:none;
      transition:.2s;
    }
    .pe-btn-home:hover{color:#fff}
    .pe-pages{
      display:inline-flex;align-items:center;gap:6px;
      background:rgba(255,255,255,.15);
      padding:6px 14px;border-radius:20px;
      font-size:12px;color:#fff;margin-bottom:24px;
    }

    @media(max-width:480px){
      .book-title{max-width:120px}
      .pe-title{font-size:18px}
    }
  </style>
</head>
<body>

<!-- 헤더 -->
<header class="reader-header">
  <div class="header-left">
    <a href="ebook-interview-store.html" class="back-btn">
      <span class="material-symbols-outlined" style="font-size:18px">arrow_back</span>
    </a>
    <span class="divider">|</span>
    <div class="dot"></div>
    <span class="book-title">대입 면접이 쉬워지는 스피치 공식</span>
    <span class="preview-badge">미리보기 10p</span>
  </div>
  <div class="header-right">
    <a href="ebook-interview-store.html" class="btn-buy-sm">
      <span class="material-symbols-outlined" style="font-size:15px">shopping_cart</span>
      79,000원 구매
    </a>
  </div>
</header>

<!-- PDF 렌더 영역 -->
<div id="pdfWrapper" class="pdf-wrapper">
  <div class="loader" id="loader">
    <div class="spinner"></div>
    <p>전자책을 불러오는 중...</p>
  </div>
</div>

<!-- 미리보기 종료 CTA (JS로 삽입) -->
<div id="previewEnd" style="display:none;display:flex;flex-direction:column;align-items:center;padding:0 16px">
  <div class="preview-end">
    <div class="pe-fade"></div>
    <div class="pe-body">
      <div class="pe-icon">📖</div>
      <div class="pe-pages">
        <span class="material-symbols-outlined" style="font-size:14px">lock</span>
        미리보기 10페이지 / 전체 보기
      </div>
      <h2 class="pe-title">나머지 내용이 궁금하신가요?<br>전체 전자책을 구매해보세요</h2>
      <p class="pe-sub">7 PART · 33챕터 · 부록 4개<br>대입면접 예상 질문 100선 · AI 면접 챗봇 사용법 포함</p>
      <p class="pe-price">79,000원</p>
      <a href="ebook-interview-store.html" class="pe-btn-buy">
        <span class="material-symbols-outlined">shopping_cart</span>
        전자책 구매하기
      </a>
      <a href="/" class="pe-btn-home">홈으로 돌아가기</a>
    </div>
  </div>
</div>

<script>
  // PDF.js worker 설정
  pdfjsLib.GlobalWorkerOptions.workerSrc =
    'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const PDF_PATH    = 'ebooks/pdf/대입 면접이 쉬워지는 스피치 공식 (스피치라엘).pdf';
  const MAX_PAGES   = 10; // 미리보기 페이지 수
  const SCALE       = window.innerWidth < 600 ? 1.2 : 1.8;

  const wrapper     = document.getElementById('pdfWrapper');
  const loader      = document.getElementById('loader');
  const previewEnd  = document.getElementById('previewEnd');

  async function renderPreview() {
    try {
      const pdf = await pdfjsLib.getDocument(PDF_PATH).promise;
      const totalPages = pdf.numPages;
      const previewCount = Math.min(MAX_PAGES, totalPages);

      loader.remove();

      for (let i = 1; i <= previewCount; i++) {
        const page = await pdf.getPage(i);
        const viewport = page.getViewport({ scale: SCALE });

        const canvas = document.createElement('canvas');
        canvas.className = 'page-canvas';
        canvas.width  = viewport.width;
        canvas.height = viewport.height;

        const label = document.createElement('p');
        label.className = 'page-label';
        label.textContent = `${i} / ${previewCount} (미리보기)`;

        wrapper.appendChild(canvas);
        wrapper.appendChild(label);

        await page.render({
          canvasContext: canvas.getContext('2d'),
          viewport
        }).promise;
      }

      // 마지막 페이지에 그라데이션 흐림 효과
      const lastCanvas = wrapper.querySelectorAll('.page-canvas');
      const last = lastCanvas[lastCanvas.length - 1];
      last.style.maskImage = 'linear-gradient(to bottom, black 50%, transparent 100%)';
      last.style.webkitMaskImage = 'linear-gradient(to bottom, black 50%, transparent 100%)';

      previewEnd.style.display = 'flex';

    } catch (err) {
      loader.innerHTML = `<p style="color:rgba(255,255,255,.6)">PDF를 불러올 수 없습니다.<br>${err.message}</p>`;
    }
  }

  renderPreview();
</script>
</body>
</html>
