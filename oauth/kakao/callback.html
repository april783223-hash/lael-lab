<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>카카오 로그인 처리 중 — LAEL LAB</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #faf9f7;
      font-family: 'Noto Sans KR', sans-serif;
      color: #1a1c1b;
    }
    .spinner {
      width: 48px; height: 48px;
      border: 4px solid #e3e2e0;
      border-top-color: #FEE500;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    p { font-size: 15px; color: #6b6b6b; }
    .error-box {
      display: none;
      margin-top: 20px;
      padding: 16px 24px;
      background: #fff0f0;
      border: 1px solid #fca5a5;
      border-radius: 12px;
      color: #b91c1c;
      font-size: 12px;
      text-align: left;
      white-space: pre-wrap;
      word-break: break-all;
      max-width: 480px;
      width: 90%;
    }
    a { color: #4c37ce; font-weight: 700; text-decoration: none; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <p>카카오 로그인 처리 중입니다...</p>
  <div class="error-box" id="errorBox">
    <p id="errorMsg">로그인 중 오류가 발생했습니다.</p>
    <p style="margin-top:8px"><a href="/">홈으로 돌아가기</a></p>
  </div>

  <script>
    const REDIRECT_URI = 'https://www.laellab.com/oauth/kakao/callback';

    function showError(msg) {
      document.querySelector('.spinner').style.display = 'none';
      document.querySelector('p').style.display = 'none';
      const box = document.getElementById('errorBox');
      box.style.display = 'block';
      document.getElementById('errorMsg').textContent = msg;
    }

    async function processKakaoCallback() {
      const params = new URLSearchParams(window.location.search);
      const code   = params.get('code');
      const error  = params.get('error');

      if (error || !code) {
        // 사용자가 로그인 취소하거나 오류 발생 → 그냥 홈으로
        window.location.replace('/');
        return;
      }

      try {
        // 1. 서버 API로 토큰 교환 (Client Secret 보호)
        const tokenRes = await fetch('/api/kakao-token', {
          method:  'POST',
          headers: { 'Content-Type': 'application/json' },
          body:    JSON.stringify({ code, redirect_uri: REDIRECT_URI })
        });
        const tokenData = await tokenRes.json();

        if (!tokenData.access_token) {
          const detail = [
            `HTTP status      : ${tokenData.kakao_http_status ?? '(없음)'}`,
            `error            : ${tokenData.error ?? '(없음)'}`,
            `error_description: ${tokenData.error_description ?? '(없음)'}`,
            `error_code       : ${tokenData.error_code ?? '(없음)'}`,
            `paramCheck       : ${JSON.stringify(tokenData.paramCheck ?? {})}`,
          ].join('\n');
          console.error('[Kakao Callback] 토큰 발급 실패\n' + detail);
          showError('카카오 토큰 발급 실패\n\n' + detail);
          return;
        }

        // 2. 카카오 사용자 정보 조회
        const userRes = await fetch('https://kapi.kakao.com/v2/user/me', {
          headers: {
            'Authorization':  'Bearer ' + tokenData.access_token,
            'Content-Type':   'application/x-www-form-urlencoded;charset=utf-8'
          }
        });
        const userData = await userRes.json();

        if (userData.code && userData.code < 0) {
          showError('사용자 정보 조회에 실패했습니다.');
          return;
        }

        const kakaoAccount = userData.kakao_account || {};
        const profile      = kakaoAccount.profile    || {};

        const user = {
          uid:         'kakao_' + userData.id,
          displayName: profile.nickname || '카카오 수강생',
          email:       kakaoAccount.email || '',
          photoURL:    profile.profile_image_url || null,
          isPaid:      false,
          provider:    'kakao'
        };

        // 3. 로컬스토리지에 저장 → 메인 페이지가 읽어서 로그인 처리
        localStorage.setItem('lael_user', JSON.stringify(user));
        localStorage.setItem('lael_kakao_login', '1'); // 새 로그인 플래그

        // 4. 메인으로 이동
        window.location.replace('/');

      } catch (err) {
        console.error('[Kakao Callback]', err);
        showError('네트워크 오류가 발생했습니다. 잠시 후 다시 시도해주세요.');
      }
    }

    processKakaoCallback();
  </script>
</body>
</html>
